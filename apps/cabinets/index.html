<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcp-arcade cabinets</title>
    <style>
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0b0b0f;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      h2 {
        font-size: 1.15rem;
        margin: 0;
        font-weight: 600;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 640px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      .seat {
        flex: 1 1 12rem;
      }
      .muted {
        color: #9a9aa6;
      }
      .block {
        border-top: 1px solid #2a2a36;
        padding-top: 0.5rem;
      }
      button,
      select {
        background: #1a1a24;
        color: #e6e6e6;
        border: 1px solid #3a3a4a;
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.picked {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      button.commit {
        border-color: #5b8c5a;
        background: #5b8c5a;
        color: #e6e6e6;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      .tape-info:focus-visible,
      label:has(input):focus-visible,
      label:has(input:focus-visible) {
        outline: 2px solid #e8a04a;
        outline-offset: 2px;
      }
      input[type='checkbox'] {
        accent-color: #e8a04a;
      }
      input::placeholder {
        color: #9a9aa6;
      }
      .tape-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: 640px;
      }
      .call-card {
        border: 2px solid #3a3a4a;
        padding: 0.55rem 0.7rem;
      }
      .call-card.biome-steel {
        border-color: #6a8aaa;
      }
      .call-card.biome-slate {
        border-color: #5a4a6a;
      }
      .call-card.biome-teal {
        border-color: #2a5a5a;
      }
      .call-card.biome-ochre {
        border-color: #a08040;
      }
      .tape-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .tape-row.picked .tape-name {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      .tape-name {
        flex: 1;
        text-align: left;
      }
      input[type='text'] {
        background: #1a1a24;
        color: #e6e6e6;
        border: 1px solid #3a3a4a;
        padding: 0.5rem 0.9rem;
        font: inherit;
      }
      .shift-code {
        font-family: ui-monospace, monospace;
        font-size: 1.25rem;
        color: #e8a04a;
        letter-spacing: 0.04em;
      }
      .tape-diff {
        color: #9a9aa6;
        font-size: 0.85rem;
        min-width: 4.5rem;
      }
      /* The level list, grouped: one quiet heading a stack, its rows under it.
         The same type as a row's difficulty word, so the heading names the
         group without shouting over the products. */
      .vibe-levels {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: 640px;
      }
      .vibe-group {
        color: #9a9aa6;
        font-size: 0.85rem;
        font-weight: 600;
        margin: 0.65rem 0 0.1rem;
      }
      .vibe-levels > .vibe-group:first-child {
        margin-top: 0;
      }
      .tape-info {
        position: relative;
        width: 1.25rem;
        height: 1.25rem;
        border: 1px solid #3a3a4a;
        border-radius: 50%;
        font-size: 0.75rem;
        line-height: 1.2rem;
        text-align: center;
        color: #9a9aa6;
        cursor: help;
        flex-shrink: 0;
      }
      .tape-why {
        display: none;
        position: absolute;
        left: 1.6rem;
        top: -0.2rem;
        width: min(22rem, calc(100vw - 2rem));
        background: #1a1a24;
        border: 1px solid #3a3a4a;
        color: #e6e6e6;
        padding: 0.4rem 0.6rem;
        z-index: 2;
        text-align: left;
        line-height: 1.3;
        font-size: 0.85rem;
      }
      .tape-info:hover .tape-why,
      .tape-info:focus .tape-why,
      .tape-info:focus-visible .tape-why {
        display: block;
      }
      /* The field is a 4:3 box, not a full-width element with letterbox
         gutters. Full screen is the canvas alone, letterboxed by the browser. */
      main.playing {
        max-width: none;
        padding: 1rem 2rem;
      }
      main.playing .column {
        max-width: none;
      }
      canvas.field {
        display: block;
        width: auto;
        max-width: 100%;
        height: min(calc(100vh - 8rem), calc((100vw - 4rem) * 3 / 4));
        aspect-ratio: 4 / 3;
        object-fit: contain;
        image-rendering: pixelated;
        background: #101018;
        outline: none;
      }
      canvas.field:focus-visible {
        outline: 2px solid #e8a04a;
        outline-offset: 3px;
      }
      canvas.field:fullscreen,
      canvas.field:-webkit-full-screen {
        width: 100vw !important;
        height: 100vh !important;
        max-width: none;
        max-height: none;
        object-fit: contain;
        background: #000;
      }
      /* ——— Vibe Typer ——————————————————————————————————————————————
         The second cabinet: three panes and a board. DOM for the chat and
         the editor, canvas for the preview. Dark like the rest; nothing
         blinks, nothing yells. */
      .cabinet-cards {
        margin-bottom: 0.5rem;
      }
      .cabinet-card .cabinet-line {
        min-width: 0;
        flex: 1;
      }
      .cabinet-card .tape-name {
        flex: 0 0 auto;
      }
      .vibe {
        max-width: none;
        /*
          The chat header's faces, sized off the settings row's type so the
          header stays in proportion when the player changes it: 1.5x the
          chosen length, floored at 20px and capped at 32px. At the four
          settings that is 21.6px (small), 25.2px (medium), 30px (large, the
          default) and 32px (huge, where the cap bites). The cap is what keeps
          a `huge` header on one line at 1280 wide.
        */
        --vibe-avatar: clamp(20px, calc(var(--vibe-font, 0.95rem) * 1.5), 32px);
      }
      .vibe-board {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.1rem;
        border-bottom: 1px solid #2a2a36;
        padding-bottom: 0.5rem;
      }
      .vibe-stat {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
      }
      .vibe-word {
        color: #9a9aa6;
        font-size: 0.85rem;
      }
      .vibe-num {
        font-variant-numeric: tabular-nums;
        font-size: 1.15rem;
        color: #e8a04a;
      }
      .vibe-dots {
        color: #5b8c5a;
        letter-spacing: 0.15em;
        min-width: 6rem;
      }
      .vibe-context {
        flex: 1 1 10rem;
      }
      .vibe-bar {
        display: block;
        flex: 1;
        height: 0.6rem;
        background: #1a1a24;
        border: 1px solid #3a3a4a;
        min-width: 6rem;
      }
      .vibe-bar-fill {
        display: block;
        height: 100%;
        width: 100%;
        background: #5b8c5a;
        transition: width 0.12s linear;
      }
      .vibe-bar-fill.warm {
        background: #e8a04a;
      }
      .vibe-bar-fill.near {
        background: #a8542a;
      }
      .vibe-toast {
        color: #e8a04a;
        min-width: 5rem;
      }
      .vibe-panes {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) minmax(16rem, 1.4fr) auto;
        gap: 0.75rem;
        align-items: stretch;
      }
      .vibe-pane {
        border: 1px solid #2a2a36;
        background: #101018;
        padding: 0.6rem;
        min-height: 360px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 0;
      }
      .vibe-head {
        color: #9a9aa6;
        font-size: 0.85rem;
        border-bottom: 1px solid #2a2a36;
        padding-bottom: 0.3rem;
      }
      /*
        The chat header's two faces. They are inline rather than flex items so
        the header's text nodes stay exactly the text nodes they were: a face
        that fails to load removes itself and what is left is the same string,
        in the same order, with the same spacing.

        There is deliberately no `line-height` on the header. A face sets its
        own line's height by being in it, and a long product name at `huge`
        wraps onto lines that carry no face — those stay the height they were,
        which is 18px of header saved over pinning every line to the face.
      */
      .vibe-avatar {
        width: var(--vibe-avatar);
        height: var(--vibe-avatar);
        vertical-align: middle;
        margin-right: 0.3rem;
        /* Drawn at 128 and shown at about a quarter of that; keep the edges. */
        image-rendering: pixelated;
      }
      /* The one separator that must keep its spaces when the head wraps. */
      .vibe-dot {
        white-space: pre;
      }
      .vibe-scroll {
        overflow-y: auto;
        max-height: 320px;
      }
      .vibe-lines {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .vibe-lines li {
        line-height: 1.35;
        font-size: var(--vibe-font, 0.95rem);
      }
      .vibe-user {
        color: #7fa3c6;
      }
      .vibe-nag {
        color: #9bb9d6;
        font-style: italic;
      }
      .vibe-agent {
        color: #e6e6e6;
      }
      .vibe-beat {
        font-size: var(--vibe-font, 0.95rem);
      }
      .vibe-code {
        font-family: ui-monospace, monospace;
        font-size: var(--vibe-font, 0.95rem);
        line-height: 1.5;
        overflow-y: auto;
        overflow-x: auto;
        flex: 1;
      }
      .vibe-line {
        color: #6a6a78;
        /* A token never breaks. A line too long for the pane scrolls sideways. */
        white-space: pre;
      }
      .vibe-line.done {
        color: #3f5c4a;
      }
      .vibe-line.landing {
        color: #e8a04a;
      }
      .vibe-live .pending {
        color: #6a6a78;
      }
      .vibe-live .ok {
        color: #e6e6e6;
      }
      .vibe-live .bad {
        color: #c4664a;
        text-decoration: underline;
      }
      .vibe-live .shimmer {
        color: #8a8a9a;
        animation: vibe-shimmer 1.6s ease-in-out infinite;
      }
      @keyframes vibe-shimmer {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.95;
        }
      }
      .vibe-caret {
        display: inline-block;
        width: 2px;
        height: 1.1em;
        margin-right: -2px;
        vertical-align: text-bottom;
        background: #e8a04a;
        animation: vibe-caret 1s steps(2, start) infinite;
      }
      @keyframes vibe-caret {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }
      .vibe-tab {
        align-self: flex-start;
        border: 1px solid #3a3a4a;
        color: #9a9aa6;
        font-size: 0.75rem;
        padding: 0.1rem 0.4rem;
      }
      .vibe-preview-pane {
        padding: 0.5rem;
      }
      canvas.vibe-preview {
        display: block;
        width: 480px;
        max-width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        background: #101018;
      }
      .vibe-standup .vibe-standup-preview {
        max-width: 480px;
      }
      .vibe-seed {
        font-family: ui-monospace, monospace;
        color: #9a9aa6;
      }
      button.linky {
        border-color: transparent;
        color: #9a9aa6;
        padding-left: 0;
      }
      .vibe-retro {
        border-top: 1px solid #2a2a36;
        padding-top: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .vibe-retro h2 {
        font-size: 1rem;
      }
      .vibe-keys {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .vibe-key {
        font-family: ui-monospace, monospace;
        border: 1px solid #3a3a4a;
        background: #1a1a24;
        color: #e8a04a;
        padding: 0.2rem 0.45rem;
      }
      @media (min-width: 1280px) {
        .vibe-panes {
          grid-template-columns: minmax(10rem, 0.8fr) minmax(24rem, 2fr) auto;
        }
      }
      @media (max-width: 900px) {
        .vibe-panes {
          grid-template-columns: 1fr;
        }
        .vibe-pane {
          min-height: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .vibe-caret,
        .vibe-live .shimmer {
          animation: none;
        }
      }
      @media (max-width: 640px) {
        main {
          padding: 1rem 0.75rem;
        }
        main.playing {
          padding: 0.5rem;
        }
        canvas.field {
          height: min(calc(100vh - 14rem), calc((100vw - 1.5rem) * 3 / 4));
        }
        .tape-why {
          left: auto;
          right: 0;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
