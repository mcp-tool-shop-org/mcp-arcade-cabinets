<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcp-arcade cabinets</title>
    <style>
      body {
        margin: 0;
        background: #0b0b0f;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 640px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .muted {
        color: #9a9aa6;
      }
      .block {
        border-top: 1px solid #2a2a36;
        padding-top: 0.5rem;
      }
      button,
      select {
        background: #1a1a24;
        color: #e6e6e6;
        border: 1px solid #3a3a4a;
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.picked {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      button.commit {
        border-color: #5b8c5a;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      /* The cabinet: 16:9 backdrop art; the field sits in the screen cut-out
         (about 18% in from the left, 10% down, 64% wide, 64% tall). Without
         the art the field is simply a dark screen on a dark frame. */
      .cabinet {
        position: relative;
        width: 100%;
        max-width: 960px;
        aspect-ratio: 16 / 9;
        background: #181822 center / contain no-repeat;
        image-rendering: pixelated;
      }
      canvas.field {
        position: absolute;
        left: 17.6%;
        top: 9.7%;
        width: 64%;
        height: 64%;
        object-fit: contain;
        image-rendering: pixelated;
        background: #101018;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
