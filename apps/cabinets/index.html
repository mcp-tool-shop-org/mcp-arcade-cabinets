<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcp-arcade cabinets</title>
    <style>
      html {
        color-scheme: dark;
      }
      /*
        The room the chrome under the field takes: the controls row, the
        status row, the hint and the way back. One value, two readers — the
        `canvas.field` height rules below and `layoutField` in `src/ghost.ts`,
        which reads it back with `getComputedStyle`. It used to be written
        here twice and hand-copied into the script as `(innerWidth <= 640 ? 14
        : 8) * 16`, so a change here silently desynced the script's integer
        scaling from the CSS fallback, and the `* 16` ignored a player who had
        raised their browser's default text size. It is a rem length on
        purpose: read back it is that player's own rem, not an assumed
        sixteen pixels.
      */
      :root {
        --field-chrome: 11rem;
        /*
          The resting look of a control. WCAG 1.4.11 asks three to one for the
          boundary of a control that has nothing else identifying it, and the
          old pair -- a #3a3a4a edge and a #1a1a24 body -- measured 1.76:1 and
          1.14:1 on the page's #0b0b0f: the menu read as a page of unmarked
          text until the pointer was over it. The edge is 3.12:1 now and the
          body 1.27:1, both measured against the page. `button.commit` and
          `button.picked` are untouched; both already cleared the bar.
        */
        --edge: #5e5e76;
        --body: #23232f;
        /*
          The boundary that carries layout rather than a control: the panes,
          the blocks, the rules between them. It was #2a2a36, 1.39:1 on the
          page, so the three panes that hold the whole typing game were
          delineated at under one and a half to one. 2.07:1 now. The panes'
          own #101018 fill is deliberately NOT moved with it: that fill is the
          measured ground for the editor's four text colors, and lifting it
          would move four ratios at once.
        */
        --rule: #444458;
      }
      body {
        margin: 0;
        background: #0b0b0f;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      h2 {
        font-size: 1.15rem;
        margin: 0;
        font-weight: 600;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 640px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      .seat {
        flex: 1 1 12rem;
      }
      /*
        A checkbox, what it is, and why it is gray: one box that cannot come
        apart. Both chrome rows wrap, and a `why` span was a plain sibling of
        the control it explains — at the width where the row broke between
        them, the reason a grayed control was gray wrapped onto the next line
        away from the control, which is the failure the helper that writes it
        exists to prevent.
      */
      .seat-group {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      /*
        A measure for running prose. `.column` is 40rem wide and holds the
        lists as well as the paragraphs, so the front door's three intro
        paragraphs ran to about eighty characters a line. This is the prose
        alone; the rows keep the column's width.
      */
      .prose {
        max-width: 34rem;
      }
      .muted {
        color: #9a9aa6;
      }
      /*
        Words for a reader's software and not for the eye: the field's
        captions, the end scene's furniture and the chat's finished lines.
        They are in the page, in order, and take no room on screen.
      */
      .offscreen {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      /* Why a grayed control is gray. Shown while it is, gone when it lives. */
      .why {
        font-size: 0.8rem;
      }
      /* What a cabinet plays like on glass. The script writes it only where
         the pointer is coarse, so a mouse never meets this rule. */
      .phone-note {
        font-size: 0.85rem;
        max-width: 34rem;
      }
      .block {
        border-top: 1px solid var(--rule);
        padding-top: 0.5rem;
      }
      button,
      select {
        background: var(--body);
        color: #e6e6e6;
        border: 1px solid var(--edge);
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.picked {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      button.commit {
        border-color: #5b8c5a;
        background: #5b8c5a;
        color: #e6e6e6;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      .tape-info:focus-visible,
      label:has(input):focus-visible,
      label:has(input:focus-visible) {
        outline: 2px solid #e8a04a;
        outline-offset: 2px;
      }
      input[type='checkbox'] {
        accent-color: #e8a04a;
      }
      input::placeholder {
        color: #9a9aa6;
      }
      .tape-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: 640px;
      }
      .call-card {
        border: 2px solid var(--edge);
        padding: 0.55rem 0.7rem;
      }
      /*
         The four calls of a shift are four members of one set, so their edges
         carry one lightness and the hue is reinforcement rather than the only
         channel -- the flavor word is already in the card. They ran 5.45,
         2.45, 2.53 and 5.29 to one on the page, so two of them barely read as
         bordered at all beside the other two. All four sit between 4.7 and
         4.9 to one now. */
      .call-card.biome-steel {
        border-color: #5f81a0; /* 4.80:1 */
      }
      .call-card.biome-slate {
        border-color: #8a74a4; /* 4.79:1 */
      }
      .call-card.biome-teal {
        border-color: #438785; /* 4.72:1 */
      }
      .call-card.biome-ochre {
        border-color: #99793c; /* 4.82:1 */
      }
      .tape-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .tape-row.picked .tape-name {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      .tape-name {
        flex: 1;
        text-align: left;
      }
      input[type='text'] {
        background: var(--body);
        color: #e6e6e6;
        border: 1px solid var(--edge);
        padding: 0.5rem 0.9rem;
        font: inherit;
      }
      .shift-code {
        font-family: ui-monospace, monospace;
        font-size: 1.25rem;
        color: #e8a04a;
        letter-spacing: 0.04em;
      }
      .tape-diff {
        color: #9a9aa6;
        font-size: 0.85rem;
        min-width: 4.5rem;
      }
      /* The level list, grouped: one quiet heading a stack, its rows under it.
         The same type as a row's difficulty word, so the heading names the
         group without shouting over the products. */
      .vibe-levels {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: 640px;
      }
      .vibe-group {
        color: #9a9aa6;
        font-size: 0.85rem;
        font-weight: 600;
        margin: 0.65rem 0 0.1rem;
      }
      .vibe-levels > .vibe-group:first-child {
        margin-top: 0;
      }
      /* The affordance and the text it opens, in one positioned box: the text
         is the button's sibling now, not its child, so the button's own name
         is 'why this tape' and not the paragraph it reveals. */
      .tape-info-wrap {
        position: relative;
        display: inline-flex;
        flex-shrink: 0;
      }
      button.tape-info {
        width: 1.25rem;
        height: 1.25rem;
        padding: 0;
        background: transparent;
        border: 1px solid var(--edge);
        border-radius: 50%;
        font-size: 0.75rem;
        line-height: 1.2rem;
        text-align: center;
        color: #9a9aa6;
        cursor: pointer;
      }
      button.tape-info[aria-expanded='true'] {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      .tape-why {
        display: block;
        position: absolute;
        left: 1.6rem;
        top: -0.2rem;
        width: min(22rem, calc(100vw - 2rem));
        background: var(--body);
        border: 1px solid var(--edge);
        color: #e6e6e6;
        padding: 0.4rem 0.6rem;
        z-index: 2;
        text-align: left;
        line-height: 1.3;
        font-size: 0.85rem;
      }
      /* An author `display` beats the browser's own rule for `hidden`, so the
         hidden state is spelled out. The text is opened by the button and by
         nothing else: hover was the whole affordance before, which a touch
         player has no way to perform. */
      .tape-why[hidden] {
        display: none;
      }
      /* The field is a 4:3 box, not a full-width element with letterbox
         gutters. Full screen is the canvas alone, letterboxed by the browser. */
      main.playing {
        max-width: none;
        padding: 1rem 2rem;
      }
      main.playing .column {
        max-width: none;
      }
      /* The box the zones are positioned against. It is the canvas's own
         size, so a third of it is a third of the FIELD and not of the page,
         and `layoutField` still measures the column and still sizes the
         canvas alone. */
      .field-box {
        position: relative;
        align-self: flex-start;
        max-width: 100%;
      }
      canvas.field {
        display: block;
        width: auto;
        max-width: 100%;
        /* A finger on the field is playing, not scrolling: without this the
           browser pans the page and double-tap-zooms the field out from
           under the player on the first press. */
        touch-action: none;
        /* Two declarations, not one: a browser that has never heard of `dvh`
           drops the second and keeps the first. `dvh` is the one that matters
           on a phone, where `vh` counts the retractable toolbar in and the
           field ends up taller than the part of the page anyone can see. */
        height: min(calc(100vh - var(--field-chrome)), calc((100vw - 4rem) * 3 / 4));
        height: min(calc(100dvh - var(--field-chrome)), calc((100vw - 4rem) * 3 / 4));
        aspect-ratio: 4 / 3;
        object-fit: contain;
        image-rendering: pixelated;
        background: #101018;
        outline: none;
      }
      /* The three zones a finger plays Ghost with: the left of the field, the
         right of it, and a band under the middle that fires. A mouse never
         sees them — it has the keys — so they are drawn under a coarse
         pointer and nowhere else, and `hidden` takes them off the end scene
         so a tap reaches the field and restarts the tape. */
      .pads {
        display: none;
      }
      @media (pointer: coarse) {
        .pads {
          display: block;
          position: absolute;
          inset: 0;
          touch-action: none;
        }
        .pads[hidden] {
          display: none;
        }
        .pad {
          position: absolute;
          border: 1px solid var(--edge);
          background: rgba(35, 35, 47, 0.35);
          border-radius: 0.4rem;
        }
        .pad-left,
        .pad-right {
          top: 0;
          bottom: 0;
          width: 30%;
        }
        .pad-left {
          left: 0;
        }
        .pad-right {
          right: 0;
        }
        .pad-fire {
          left: 32%;
          right: 32%;
          bottom: 0;
          height: 36%;
          background: rgba(232, 160, 74, 0.22);
          border-color: #e8a04a;
        }
      }
      canvas.field:focus-visible {
        outline: 2px solid #e8a04a;
        outline-offset: 3px;
      }
      canvas.field:fullscreen,
      canvas.field:-webkit-full-screen {
        width: 100vw !important;
        height: 100vh !important;
        max-width: none;
        max-height: none;
        object-fit: contain;
        background: #000;
      }
      /* ——— Vibe Typer ——————————————————————————————————————————————
         The second cabinet: three panes and a board. DOM for the chat and
         the editor, canvas for the preview. Dark like the rest; nothing
         blinks, nothing yells. */
      .cabinet-cards {
        margin-bottom: 0.5rem;
      }
      .cabinet-card .cabinet-line {
        min-width: 0;
        flex: 1;
      }
      /* Every other row in the shell flexes the name and fixes the trailing
         column. These two shrink-wrapped theirs instead, so the first two rows
         a first visit sees shared no column edge with the twenty rows beneath
         them, and the two card names did not line up with each other either.
         A fixed name column gives the cards one left edge and one tagline
         edge, and puts them roughly over the list below. */
      .cabinet-card .tape-name {
        flex: 0 0 12rem;
      }
      .vibe {
        max-width: none;
        /*
          The chat header's faces, sized off the settings row's type so the
          header stays in proportion when the player changes it: 1.5x the
          chosen length, floored at 20px and capped at 32px. At the four
          settings that is 21.6px (small), 25.2px (medium), 30px (large, the
          default) and 32px (huge, where the cap bites). The cap is what keeps
          a `huge` header on one line at 1280 wide.
        */
        --vibe-avatar: clamp(20px, calc(var(--vibe-font, 0.95rem) * 1.5), 32px);
      }
      .vibe-board {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.1rem;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 0.5rem;
      }
      .vibe-stat {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
      }
      .vibe-word {
        color: #9a9aa6;
        font-size: 0.85rem;
      }
      .vibe-num {
        font-variant-numeric: tabular-nums;
        font-size: 1.15rem;
        color: #e8a04a;
      }
      .vibe-dots {
        color: #5b8c5a;
        letter-spacing: 0.15em;
        min-width: 6rem;
      }
      .vibe-context {
        flex: 1 1 10rem;
      }
      .vibe-bar {
        display: block;
        flex: 1;
        height: 0.6rem;
        background: var(--body);
        border: 1px solid var(--edge);
        min-width: 6rem;
      }
      .vibe-bar-fill {
        display: block;
        height: 100%;
        width: 100%;
        background: #5b8c5a;
        transition: width 0.12s linear;
      }
      .vibe-bar-fill.warm {
        background: #e8a04a;
      }
      .vibe-bar-fill.near {
        background: #a8542a;
      }
      .vibe-toast {
        color: #e8a04a;
        min-width: 5rem;
      }
      .vibe-panes {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) minmax(16rem, 1.4fr) auto;
        gap: 0.75rem;
        align-items: stretch;
      }
      .vibe-pane {
        border: 1px solid var(--rule);
        background: #101018;
        padding: 0.6rem;
        min-height: 360px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 0;
      }
      /* The editor pane takes the keys, so it is focusable and says so: a
         player who has just pressed a button can see where the letters go. */
      .vibe-pane:focus-visible {
        outline: 2px solid #e8a04a;
        outline-offset: 2px;
      }
      /* The pane's own name row. It is furniture INSIDE the pane the type
         setting governs, so it rises with the text it labels rather than
         staying at a fixed 0.85rem while the code beside it reaches 1.5rem --
         the way `.vibe-mark` already does at 0.8em. The step is anchored so
         that at the default type (large, 1.25rem) it is exactly the 0.85rem
         it always was, with a floor so the small setting cannot shrink it
         past legibility. */
      .vibe-head {
        color: #9a9aa6;
        font-size: max(0.75rem, calc(var(--vibe-font, 0.95rem) * 0.68));
        border-bottom: 1px solid var(--rule);
        padding-bottom: 0.3rem;
      }
      /*
        The chat header's two faces. They are inline rather than flex items so
        the header's text nodes stay exactly the text nodes they were: a face
        that fails to load removes itself and what is left is the same string,
        in the same order, with the same spacing.

        There is deliberately no `line-height` on the header. A face sets its
        own line's height by being in it, and a long product name at `huge`
        wraps onto lines that carry no face — those stay the height they were,
        which is 18px of header saved over pinning every line to the face.
      */
      .vibe-avatar {
        width: var(--vibe-avatar);
        height: var(--vibe-avatar);
        vertical-align: middle;
        margin-right: 0.3rem;
        /* Drawn at 128 and shown at about a quarter of that; keep the edges. */
        image-rendering: pixelated;
      }
      /* The one separator that must keep its spaces when the head wraps. */
      .vibe-dot {
        white-space: pre;
      }
      /*
        Twelve lines of the chat, whatever a line is. The cap was a flat 320px
        while everything inside it is a rem: at the default type that was
        about thirteen lines, at `huge` eight, and for a player who had also
        raised their browser's own text size, five. The chat is this cabinet's
        whole narrative, so the one dimension that decides how much of it is
        visible now moves with both the type setting and the browser
        preference. 1.35 is `.vibe-lines li`'s line-height.
      */
      .vibe-scroll {
        overflow-y: auto;
        max-height: calc(var(--vibe-font, 0.95rem) * 1.35 * 12);
      }
      .vibe-lines {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .vibe-lines li {
        line-height: 1.35;
        font-size: var(--vibe-font, 0.95rem);
      }
      .vibe-user {
        color: #7fa3c6;
      }
      /* The standup quotes the player's last user line outside `.vibe-lines`,
         so it had neither the type setting nor a line-height: the same words
         that were on screen a second earlier at the chosen size dropped to the
         browser default at the emotional payoff of the run. */
      .vibe-standup .vibe-user {
        font-size: var(--vibe-font, 0.95rem);
        line-height: 1.35;
      }
      .vibe-nag {
        color: #9bb9d6;
        font-style: italic;
      }
      .vibe-agent {
        color: #e6e6e6;
      }
      /* A quick sync: the lines are the other party's half of a call, so they
         are not painted as the agent's ordinary replies, and a quiet row
         marks where the meeting starts and ends. */
      .vibe-sync {
        color: #cdbf9a;
        border-left: 2px solid #6a5a3a;
        padding-left: 0.5rem;
      }
      .vibe-mark {
        color: #8a7a5a;
        font-size: 0.8em;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        border-top: 1px solid #3a3a44;
        padding-top: 0.35rem;
      }
      .vibe-beat {
        font-size: var(--vibe-font, 0.95rem);
      }
      .vibe-code {
        font-family: ui-monospace, monospace;
        font-size: var(--vibe-font, 0.95rem);
        line-height: 1.5;
        overflow-y: auto;
        overflow-x: auto;
        flex: 1;
      }
      /*
        The text the player has not typed yet is the one thing a typing game
        asks anyone to read, and it sat at #6a6a78 on the pane's #101018 —
        about 3.6:1, under the 4.5:1 body-text floor, with the default type at
        20px regular, which is not large text. It is lifted to #8a8a9a, about
        5:1, which is the color the copilot's own faded rest of the line
        already used. `.done` stays dim: it is history, not something to read
        ahead of.
      */
      .vibe-line {
        color: #8a8a9a;
        /* A token never breaks. A line too long for the pane scrolls sideways. */
        white-space: pre;
      }
      /*
        History, but readable history: everything above the caret is the
        indentation and the surrounding code the player reads to place the next
        line. #3f5c4a was 2.58:1 on the pane's #101018 -- under even the 3:1
        large-text floor, with the default type at 1.25rem regular, which is
        not large text -- and the drop at the caret was five-fold at the moment
        of success. 4.83:1 now, still plainly below the 5.57:1 of the text not
        yet typed, so the hierarchy reads the way round it always did.
      */
      .vibe-line.done {
        color: #5f8a70;
      }
      .vibe-line.landing {
        color: #e8a04a;
      }
      .vibe-live .pending {
        color: #8a8a9a;
      }
      .vibe-live .ok {
        color: #e6e6e6;
      }
      .vibe-live .bad {
        color: #c4664a;
        text-decoration: underline;
      }
      .vibe-live .shimmer {
        color: #8a8a9a;
        animation: vibe-shimmer 1.6s ease-in-out infinite;
      }
      @keyframes vibe-shimmer {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.95;
        }
      }
      .vibe-caret {
        display: inline-block;
        width: 2px;
        height: 1.1em;
        margin-right: -2px;
        vertical-align: text-bottom;
        background: #e8a04a;
        animation: vibe-caret 1s steps(2, start) infinite;
      }
      @keyframes vibe-caret {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }
      /* The affordance label inside the pane the type setting governs: at
         `huge` the code was 1.5rem and the chip that says the copilot's line
         can be taken was half its size. Anchored like `.vibe-head`, so at the
         default type it is the 0.75rem it always was. */
      .vibe-tab {
        align-self: flex-start;
        border: 1px solid var(--edge);
        color: #9a9aa6;
        font-size: max(0.7rem, calc(var(--vibe-font, 0.95rem) * 0.6));
        padding: 0.1rem 0.4rem;
      }
      .vibe-preview-pane {
        padding: 0.5rem;
      }
      canvas.vibe-preview {
        display: block;
        width: 480px;
        max-width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        background: #101018;
      }
      .vibe-standup .vibe-standup-preview {
        max-width: 480px;
      }
      .vibe-seed {
        font-family: ui-monospace, monospace;
        color: #9a9aa6;
      }
      button.linky {
        border-color: transparent;
        color: #9a9aa6;
        padding-left: 0;
      }
      .vibe-retro {
        border-top: 1px solid var(--rule);
        padding-top: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .vibe-retro h2 {
        font-size: 1rem;
      }
      .vibe-keys {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .vibe-key {
        font-family: ui-monospace, monospace;
        border: 1px solid var(--edge);
        background: var(--body);
        color: #e8a04a;
        padding: 0.2rem 0.45rem;
      }
      @media (min-width: 1280px) {
        .vibe-panes {
          grid-template-columns: minmax(10rem, 0.8fr) minmax(24rem, 2fr) auto;
        }
      }
      /*
        The one-column fallback, and the width it has to arrive at.

        Measured from the track minimums of `.vibe-panes` above: 12rem (192) +
        16rem (256) + the preview track, which is `canvas.vibe-preview` at a
        hard 480 inside `.vibe-preview-pane`'s 0.5rem padding either side
        (496), + two 0.75rem gaps (24) = 968. `main.playing` adds 2rem of
        padding either side, so the three-pane board needs a 1032px viewport.
        The collapse used to arrive at 900, which left a dead band from 901 to
        1031 where the explicit minima refused to shrink: a horizontal page
        scrollbar and a clipped preview at half a 1920 display (960) and at a
        tablet in landscape (1024), two of the commonest widths this opens at.
        1031 is the last width that overflows, so it is the last width that
        collapses.
      */
      @media (max-width: 1031px) {
        .vibe-panes {
          grid-template-columns: 1fr;
        }
        .vibe-pane {
          min-height: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .vibe-caret,
        .vibe-live .shimmer {
          animation: none;
        }
      }
      @media (max-width: 640px) {
        /* The phone carries more chrome under the field, so the allowance
           grows here — in the one place that holds it, which the script reads
           back rather than copying the breakpoint. */
        :root {
          --field-chrome: 15rem;
        }
        main {
          padding: 1rem 0.75rem;
        }
        main.playing {
          padding: 0.5rem;
        }
        canvas.field {
          height: min(calc(100vh - var(--field-chrome)), calc((100vw - 1.5rem) * 3 / 4));
          height: min(calc(100dvh - var(--field-chrome)), calc((100vw - 1.5rem) * 3 / 4));
        }
        .tape-why {
          left: auto;
          right: 0;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
