<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcp-arcade cabinets</title>
    <style>
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0b0b0f;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      h2 {
        font-size: 1.15rem;
        margin: 0;
        font-weight: 600;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 640px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      .seat {
        flex: 1 1 12rem;
      }
      .muted {
        color: #9a9aa6;
      }
      .block {
        border-top: 1px solid #2a2a36;
        padding-top: 0.5rem;
      }
      button,
      select {
        background: #1a1a24;
        color: #e6e6e6;
        border: 1px solid #3a3a4a;
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.picked {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      button.commit {
        border-color: #5b8c5a;
        background: #5b8c5a;
        color: #e6e6e6;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      .tape-info:focus-visible,
      label:has(input):focus-visible,
      label:has(input:focus-visible) {
        outline: 2px solid #e8a04a;
        outline-offset: 2px;
      }
      input[type='checkbox'] {
        accent-color: #e8a04a;
      }
      input::placeholder {
        color: #9a9aa6;
      }
      .tape-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: 640px;
      }
      .call-card {
        border: 2px solid #3a3a4a;
        padding: 0.55rem 0.7rem;
      }
      .call-card.biome-steel {
        border-color: #6a8aaa;
      }
      .call-card.biome-slate {
        border-color: #5a4a6a;
      }
      .call-card.biome-teal {
        border-color: #2a5a5a;
      }
      .call-card.biome-ochre {
        border-color: #a08040;
      }
      .tape-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .tape-row.picked .tape-name {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      .tape-name {
        flex: 1;
        text-align: left;
      }
      input[type='text'] {
        background: #1a1a24;
        color: #e6e6e6;
        border: 1px solid #3a3a4a;
        padding: 0.5rem 0.9rem;
        font: inherit;
      }
      .shift-code {
        font-family: ui-monospace, monospace;
        font-size: 1.25rem;
        color: #e8a04a;
        letter-spacing: 0.04em;
      }
      .tape-diff {
        color: #9a9aa6;
        font-size: 0.85rem;
        min-width: 4.5rem;
      }
      .tape-info {
        position: relative;
        width: 1.25rem;
        height: 1.25rem;
        border: 1px solid #3a3a4a;
        border-radius: 50%;
        font-size: 0.75rem;
        line-height: 1.2rem;
        text-align: center;
        color: #9a9aa6;
        cursor: help;
        flex-shrink: 0;
      }
      .tape-why {
        display: none;
        position: absolute;
        left: 1.6rem;
        top: -0.2rem;
        width: min(22rem, calc(100vw - 2rem));
        background: #1a1a24;
        border: 1px solid #3a3a4a;
        color: #e6e6e6;
        padding: 0.4rem 0.6rem;
        z-index: 2;
        text-align: left;
        line-height: 1.3;
        font-size: 0.85rem;
      }
      .tape-info:hover .tape-why,
      .tape-info:focus .tape-why,
      .tape-info:focus-visible .tape-why {
        display: block;
      }
      /* The field is a 4:3 box, not a full-width element with letterbox
         gutters. Full screen is the canvas alone, letterboxed by the browser. */
      main.playing {
        max-width: none;
        padding: 1rem 2rem;
      }
      main.playing .column {
        max-width: none;
      }
      canvas.field {
        display: block;
        width: auto;
        max-width: 100%;
        height: min(calc(100vh - 8rem), calc((100vw - 4rem) * 3 / 4));
        aspect-ratio: 4 / 3;
        object-fit: contain;
        image-rendering: pixelated;
        background: #101018;
        outline: none;
      }
      canvas.field:focus-visible {
        outline: 2px solid #e8a04a;
        outline-offset: 3px;
      }
      canvas.field:fullscreen,
      canvas.field:-webkit-full-screen {
        width: 100vw !important;
        height: 100vh !important;
        max-width: none;
        max-height: none;
        object-fit: contain;
        background: #000;
      }
      @media (max-width: 640px) {
        main {
          padding: 1rem 0.75rem;
        }
        main.playing {
          padding: 0.5rem;
        }
        canvas.field {
          height: min(calc(100vh - 14rem), calc((100vw - 1.5rem) * 3 / 4));
        }
        .tape-why {
          left: auto;
          right: 0;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
