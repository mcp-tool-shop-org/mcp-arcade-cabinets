<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcp-arcade cabinets</title>
    <style>
      body {
        margin: 0;
        background: #0b0b0f;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 640px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .muted {
        color: #9a9aa6;
      }
      .block {
        border-top: 1px solid #2a2a36;
        padding-top: 0.5rem;
      }
      button,
      select {
        background: #1a1a24;
        color: #e6e6e6;
        border: 1px solid #3a3a4a;
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.picked {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      button.commit {
        border-color: #5b8c5a;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .tape-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: 640px;
      }
      .tape-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .tape-row.picked .tape-name {
        border-color: #e8a04a;
        color: #e8a04a;
      }
      .tape-name {
        flex: 1;
        text-align: left;
      }
      .tape-diff {
        color: #9a9aa6;
        font-size: 0.85rem;
        min-width: 4.5rem;
      }
      .tape-info {
        position: relative;
        width: 1.25rem;
        height: 1.25rem;
        border: 1px solid #3a3a4a;
        border-radius: 50%;
        font-size: 0.75rem;
        line-height: 1.2rem;
        text-align: center;
        color: #9a9aa6;
        cursor: help;
        flex-shrink: 0;
      }
      .tape-why {
        display: none;
        position: absolute;
        left: 1.6rem;
        top: -0.2rem;
        width: 22rem;
        background: #1a1a24;
        border: 1px solid #3a3a4a;
        color: #e6e6e6;
        padding: 0.4rem 0.6rem;
        z-index: 2;
        text-align: left;
        line-height: 1.3;
        font-size: 0.85rem;
      }
      .tape-info:hover .tape-why,
      .tape-info:focus .tape-why {
        display: block;
      }
      /* While a cabinet is playing the page gives it the width; the field is
         as wide as the viewport allows and keeps 4:3. Full screen is the
         canvas alone, letterboxed by the browser. */
      main.playing {
        max-width: none;
        padding: 1rem 2rem;
      }
      main.playing .column {
        max-width: none;
      }
      canvas.field {
        display: block;
        width: 100%;
        max-height: calc(100vh - 8rem);
        aspect-ratio: 4 / 3;
        object-fit: contain;
        image-rendering: pixelated;
        background: #101018;
        outline: none;
      }
      canvas.field:fullscreen {
        width: 100vw;
        height: 100vh;
        max-height: none;
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
