name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'apps/**'
      - 'fixtures/**'
      - 'scripts/**'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - '.gitignore'
      - '.gitattributes'
      - 'Dockerfile'
      - '.dockerignore'
      - 'catalog/**'
      - 'voice/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        # pnpm version comes from package.json packageManager
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Env files stay ignored
        run: |
          git check-ignore -q .env
          git check-ignore -q .env.local
          git check-ignore -q -- '*.pem'
          if git check-ignore -q .env.example; then
            echo ".env.example must not be ignored"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:play ghost --fixture naive-ndjson
      - name: Voice worker syntax
        run: python3 -m py_compile voice/worker.py

  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Catalog image
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not available; skipping Catalog image build"
            exit 0
          fi
          docker build -t mcp-arcade-cabinets:ci .
