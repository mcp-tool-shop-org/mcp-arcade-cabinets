name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'apps/**'
      - 'fixtures/**'
      - 'scripts/**'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - '.gitignore'
      - '.gitattributes'
      - 'Dockerfile'
      - '.dockerignore'
      - 'catalog/**'
      - 'voice/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        # pnpm version comes from package.json packageManager
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Env files stay ignored
        run: |
          failed=0
          if git check-ignore -- .env; then
            echo "ignored: .env"
          else
            echo "not ignored: .env"
            echo "next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
            failed=1
          fi
          if git check-ignore -- .env.local; then
            echo "ignored: .env.local"
          else
            echo "not ignored: .env.local"
            echo "next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
            failed=1
          fi
          if git check-ignore -- '*.pem'; then
            echo "ignored: *.pem"
          else
            echo "not ignored: *.pem"
            echo "next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
            failed=1
          fi
          if git check-ignore -- .env.example; then
            echo ".env.example must not be ignored"
            echo "next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
            failed=1
          else
            echo "not ignored (ok): .env.example"
          fi
          exit "$failed"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level=high
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Play-through
        run: pnpm test:play ghost --fixture naive-ndjson
      - name: Voice worker syntax
        run: python3 -m py_compile voice/worker.py
      - name: Next local command
        if: failure()
        run: |
          {
            echo "## Verify failed"
            echo "Re-run the failing gate locally:"
            echo "- next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
            echo "- next: pnpm install --frozen-lockfile"
            echo "- next: pnpm audit --audit-level=high"
            echo "- next: pnpm lint"
            echo "- next: pnpm typecheck"
            echo "- next: pnpm test"
            echo "- next: pnpm build"
            echo "- next: pnpm test:play ghost --fixture naive-ndjson"
            echo "- next: python3 -m py_compile voice/worker.py"
          } >> "$GITHUB_STEP_SUMMARY"

  catalog:
    name: Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Catalog image
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not available; skipping Catalog image build"
            exit 0
          fi
          docker build -t mcp-arcade-cabinets:ci .
      - name: Next local command
        if: failure()
        run: |
          {
            echo "## Catalog failed"
            echo "- next: docker build -t mcp-arcade-cabinets:ci ."
          } >> "$GITHUB_STEP_SUMMARY"
