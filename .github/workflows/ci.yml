# Measured, not estimated (F-13e1f059): a completed real run of this workflow
# (run 35153016331, push to main, 2026-09-16) billed 2 ubuntu-latest minutes
# for Verify (21:33:14-21:34:45, 91s -> 2 min) and 2 ubuntu-latest minutes for
# Catalog (21:33:14-21:34:46, 92s -> 2 min; its "Build Catalog image" step,
# a cacheonly linux/amd64+arm64 buildx build plus a loaded amd64 build and a
# --network=none stdio smoke run, was the bulk of that job at 66s) -- 4
# ubuntu-latest minutes per push in that run. Re-measure with
# `gh api repos/mcp-tool-shop-org/mcp-arcade-cabinets/actions/runs/<id>/jobs`
# rather than trusting this comment to stay current.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'apps/**'
      - 'fixtures/**'
      - 'scripts/**'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - '.gitignore'
      - '.gitattributes'
      - 'Dockerfile'
      - '.dockerignore'
      - 'catalog/**'
      - 'voice/**'
      - '.github/workflows/**'
      - 'atlas/**'
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'apps/**'
      - 'fixtures/**'
      - 'scripts/**'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - '.gitignore'
      - '.gitattributes'
      - 'Dockerfile'
      - '.dockerignore'
      - 'catalog/**'
      - 'voice/**'
      - '.github/workflows/**'
      - 'atlas/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        # pnpm version comes from package.json packageManager
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Atlas check
        id: atlas
        run: npx --yes @dogfood-lab/atlas@1.17.0 check
      - name: Env files stay ignored
        id: env_ignore
        run: |
          failed=0
          probe_ignore() {
            local p="$1"
            if git check-ignore -- "$p"; then
              echo "ignored: $p"
            else
              echo "not ignored: $p"
              echo "next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
              {
                echo "not ignored: $p"
                echo "next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
              } >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          }
          probe_ignore .env
          probe_ignore .env.local
          probe_ignore '*.pem'
          probe_ignore apps/cabinets/.env
          probe_ignore apps/cabinets/.env.local
          for pkg in packages/*/; do
            probe_ignore "${pkg%/}/.env"
            probe_ignore "${pkg%/}/.env.local"
          done
          if git check-ignore -- .env.example; then
            echo ".env.example must not be ignored"
            echo "next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
            {
              echo ".env.example must not be ignored"
              echo "next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
            } >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "not ignored (ok): .env.example"
          fi
          exit "$failed"
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Audit
        id: audit
        run: pnpm audit --audit-level=high
      - name: Lint
        id: lint
        run: pnpm lint
      - name: Typecheck
        id: typecheck
        run: pnpm typecheck
      - name: Test
        id: test
        run: pnpm test
      - name: Build
        id: build
        run: pnpm build
      - name: Play-through
        id: play_through
        run: pnpm test:play ghost --fixture naive-ndjson
      - name: Voice worker syntax
        id: voice
        run: python3 -m py_compile voice/worker.py
      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI / Verify"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- audit: pnpm audit --audit-level=high (${{ steps.audit.outcome }})"
            echo "- test:play: ghost --fixture naive-ndjson (${{ steps.play_through.outcome }})"
            echo "- voice: python3 -m py_compile voice/worker.py (${{ steps.voice.outcome }})"
            echo "- env-ignore: ${{ steps.env_ignore.outcome }}"
            echo "- install: ${{ steps.install.outcome }}"
            echo "- lint: ${{ steps.lint.outcome }}"
            echo "- typecheck: ${{ steps.typecheck.outcome }}"
            echo "- test: ${{ steps.test.outcome }}"
            echo "- build: ${{ steps.build.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Next local command
        if: failure()
        run: |
          {
            echo "## CI / Verify failed"
            echo "Re-run the failing gate locally:"
            [ "${{ steps.env_ignore.outcome }}" = "failure" ] && echo "- next: restore .env / .env.* / *.pem and !.env.example in .gitignore"
            [ "${{ steps.install.outcome }}" = "failure" ] && echo "- next: pnpm install --frozen-lockfile"
            [ "${{ steps.audit.outcome }}" = "failure" ] && echo "- next: pnpm audit --audit-level=high"
            [ "${{ steps.lint.outcome }}" = "failure" ] && echo "- next: pnpm lint"
            [ "${{ steps.typecheck.outcome }}" = "failure" ] && echo "- next: pnpm typecheck"
            [ "${{ steps.test.outcome }}" = "failure" ] && echo "- next: pnpm test"
            [ "${{ steps.build.outcome }}" = "failure" ] && echo "- next: pnpm build"
            [ "${{ steps.play_through.outcome }}" = "failure" ] && echo "- next: pnpm test:play ghost --fixture naive-ndjson"
            [ "${{ steps.voice.outcome }}" = "failure" ] && echo "- next: python3 -m py_compile voice/worker.py"
          } >> "$GITHUB_STEP_SUMMARY"

  catalog:
    name: Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Catalog contract
        id: catalog_contract
        run: |
          if ! grep -qE '^[[:space:]]*disableNetwork:[[:space:]]*true[[:space:]]*$' catalog/server.yaml; then
            echo "catalog/server.yaml must set run.disableNetwork: true"
            echo "next: set catalog/server.yaml run.disableNetwork: true"
            exit 1
          fi
          echo "disableNetwork: true"
          image=$(awk '/^image:/{print $2; exit}' catalog/server.yaml)
          image=${image#\"}
          image=${image%\"}
          image=${image#\'}
          image=${image%\'}
          echo "image=$image"
          if printf '%s\n' "$image" | grep -qE ':latest(@|$)'; then
            echo "catalog/server.yaml image: must not use :latest ($image)"
            echo "next: pin catalog/server.yaml image by digest, not :latest"
            exit 1
          fi
          pin=$(grep -A2 '^source:' catalog/server.yaml | awk '/commit:/{print $2; exit}')
          echo "source.commit=$pin"
          echo "github.sha=${{ github.sha }}"
          if [ -z "$pin" ]; then
            echo "catalog/server.yaml source.commit is empty"
            echo "next: pin catalog/server.yaml source.commit to ${{ github.sha }}"
            exit 1
          fi
          if [ "$pin" = "${{ github.sha }}" ]; then
            echo "source.commit equals github.sha"
          elif git merge-base --is-ancestor "$pin" "${{ github.sha }}"; then
            echo "source.commit is an ancestor of github.sha"
          else
            echo "source.commit $pin is not github.sha and is not an ancestor of ${{ github.sha }}"
            echo "next: pin catalog/server.yaml source.commit to a commit in this history"
            exit 1
          fi
          python3 -c '
          import json, pathlib, sys
          cat = {t["name"] for t in json.loads(pathlib.Path("catalog/tools.json").read_text(encoding="utf-8"))}
          pkg = {t["name"] for t in json.loads(pathlib.Path("packages/cabinet-server/tools.json").read_text(encoding="utf-8"))["tools"]}
          if cat != pkg:
              print("catalog tools", sorted(cat), "!= cabinet-server tools", sorted(pkg))
              sys.exit(1)
          print("tool names match:", ",".join(sorted(cat)))
          '
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Hub digest pin
        id: hub_digest
        run: |
          echo "hub_digest=skipped" >> "$GITHUB_OUTPUT"
          echo "ghcr_digest=skipped" >> "$GITHUB_OUTPUT"
          set +e
          inspect_out=$(docker buildx imagetools inspect mcp/mcp-arcade-cabinets 2>/tmp/hub-inspect.err)
          inspect_status=$?
          set -e
          if [ "$inspect_status" -ne 0 ]; then
            echo "Hub listing not present; skip digest compare"
            if [ -s /tmp/hub-inspect.err ]; then
              cat /tmp/hub-inspect.err >&2
            fi
          else
            hub_digest=$(printf '%s\n' "$inspect_out" | awk '/^Digest:/{print $2; exit}')
            if [ -z "$hub_digest" ]; then
              echo "docker buildx imagetools inspect mcp/mcp-arcade-cabinets succeeded but Digest is empty"
              echo "next: pin catalog/server.yaml image to mcp/mcp-arcade-cabinets@sha256:<Hub digest>"
              exit 1
            fi
            echo "hub_digest=$hub_digest" >> "$GITHUB_OUTPUT"
            echo "Hub digest: $hub_digest"
            image=$(awk '/^image:/{print $2; exit}' catalog/server.yaml)
            image=${image#\"}
            image=${image%\"}
            image=${image#\'}
            image=${image%\'}
            if ! printf '%s\n' "$image" | grep -q '@sha256:'; then
              echo "catalog/server.yaml image: must contain @sha256: now that Hub lists mcp/mcp-arcade-cabinets (got $image)"
              echo "local docker image id is not the Hub pin"
              echo "next: pin catalog/server.yaml image to mcp/mcp-arcade-cabinets@$hub_digest"
              exit 1
            fi
            yaml_digest=${image##*@}
            if [ "$yaml_digest" != "$hub_digest" ]; then
              echo "catalog/server.yaml image digest $yaml_digest != Hub digest $hub_digest"
              echo "local docker image id is not the Hub pin"
              echo "next: pin catalog/server.yaml image to mcp/mcp-arcade-cabinets@$hub_digest"
              exit 1
            fi
            echo "catalog/server.yaml image digest matches Hub"
          fi
          set +e
          ghcr_out=$(docker buildx imagetools inspect ghcr.io/mcp-tool-shop-org/mcp-arcade-cabinets:0.7.0 2>/tmp/ghcr-inspect.err)
          ghcr_status=$?
          set -e
          if [ "$ghcr_status" -eq 0 ]; then
            ghcr_digest=$(printf '%s\n' "$ghcr_out" | awk '/^Digest:/{print $2; exit}')
            if [ -n "$ghcr_digest" ]; then
              echo "ghcr_digest=$ghcr_digest" >> "$GITHUB_OUTPUT"
              echo "GHCR digest: $ghcr_digest"
            else
              echo "GHCR inspect skipped"
            fi
          else
            echo "GHCR inspect skipped"
          fi
      - name: Build Catalog image
        id: docker_build
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker=missing" >> "$GITHUB_OUTPUT"
            echo "docker is required on ubuntu-latest; Catalog image was not built"
            echo "next: docker buildx build --platform linux/amd64,linux/arm64 -t mcp-arcade-cabinets:ci ."
            exit 1
          fi
          echo "docker=present" >> "$GITHUB_OUTPUT"
          echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          # buildx cannot --load a multi-platform image; prove both, load amd64 only
          docker buildx build --platform linux/amd64,linux/arm64 -t mcp-arcade-cabinets:ci --output=type=cacheonly .
          docker buildx build --platform linux/amd64 -t mcp-arcade-cabinets:ci --load .
          id=$(docker image inspect -f '{{.Id}}' mcp-arcade-cabinets:ci)
          echo "image_id=$id" >> "$GITHUB_OUTPUT"
          echo "image id: $id"
          echo "platforms built: linux/amd64,linux/arm64"
      - name: Run Catalog image over stdio
        id: docker_run
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          notified='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          set +e
          printf '%s\n' "$init" "$notified" "$list" | timeout 20 docker run --rm -i --network=none --cpus 1 --memory 2g mcp-arcade-cabinets:ci > /tmp/cabinet-stdio.out 2>/tmp/cabinet-stdio.err
          status=$?
          set -e
          if [ -s /tmp/cabinet-stdio.err ]; then
            cat /tmp/cabinet-stdio.err >&2
          fi
          cat /tmp/cabinet-stdio.out
          if ! python3 -c '
          import json, sys
          need = {"fire", "say", "speak", "sfx", "view", "tapes"}
          found = set()
          raw = sys.stdin.read()
          for line in raw.splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  msg = json.loads(line)
              except json.JSONDecodeError:
                  continue
              tools = (msg.get("result") or {}).get("tools")
              if not isinstance(tools, list):
                  continue
              for t in tools:
                  if isinstance(t, dict) and isinstance(t.get("name"), str):
                      found.add(t["name"])
          missing = sorted(need - found)
          if missing:
              print("tools/list missing:", ",".join(missing))
              sys.exit(1)
          extra = sorted(found - need)
          if extra:
              print("tools/list extra:", ",".join(extra))
              sys.exit(1)
          print("tools/list:", ",".join(sorted(found)))
          ' < /tmp/cabinet-stdio.out; then
            echo "docker run exit $status (stdio tools/list under --network none)"
            echo "next: docker run --rm -i --network=none mcp-arcade-cabinets:ci"
            exit 1
          fi
      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI / Catalog"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- docker: ${{ steps.docker_build.outputs.docker }}"
            plats="${{ steps.docker_build.outputs.platforms }}"
            [ -z "$plats" ] && plats=not-built
            echo "- platforms built: $plats"
            host_id="${{ steps.docker_build.outputs.image_id }}"
            [ -z "$host_id" ] && host_id=not-built
            echo "- host-arch image id: \`$host_id\`"
            hub="${{ steps.hub_digest.outputs.hub_digest }}"
            [ -z "$hub" ] && hub=skipped
            echo "- Hub digest: \`$hub\`"
            ghcr="${{ steps.hub_digest.outputs.ghcr_digest }}"
            [ -z "$ghcr" ] && ghcr=skipped
            echo "- GHCR digest: \`$ghcr\`"
            echo "- contract: ${{ steps.catalog_contract.outcome }}"
            echo "- qemu: ${{ steps.qemu.outcome }}"
            echo "- buildx: ${{ steps.buildx.outcome }}"
            echo "- hub digest: ${{ steps.hub_digest.outcome }}"
            echo "- docker build: ${{ steps.docker_build.outcome }}"
            echo "- docker run (stdio tools/list, --network none): ${{ steps.docker_run.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Next local command
        if: failure()
        run: |
          {
            echo "## CI / Catalog failed"
            echo "Re-run the failing gate locally:"
            [ "${{ steps.catalog_contract.outcome }}" = "failure" ] && echo "- next: check catalog/server.yaml disableNetwork: true, refuse :latest, source.commit, and catalog/tools.json names"
            [ "${{ steps.qemu.outcome }}" = "failure" ] && echo "- next: docker/setup-qemu-action (linux/arm64)"
            [ "${{ steps.buildx.outcome }}" = "failure" ] && echo "- next: docker/setup-buildx-action"
            [ "${{ steps.hub_digest.outcome }}" = "failure" ] && echo "- next: pin catalog/server.yaml image to mcp/mcp-arcade-cabinets@sha256 matching docker buildx imagetools inspect mcp/mcp-arcade-cabinets"
            [ "${{ steps.docker_build.outcome }}" = "failure" ] && echo "- next: docker buildx build --platform linux/amd64,linux/arm64 && docker buildx build --platform linux/amd64 -t mcp-arcade-cabinets:ci --load ."
            [ "${{ steps.docker_run.outcome }}" = "failure" ] && echo "- next: docker run --rm -i --network=none --cpus 1 --memory 2g mcp-arcade-cabinets:ci"
          } >> "$GITHUB_STEP_SUMMARY"
