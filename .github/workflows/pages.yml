name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/**'
      - 'packages/**'
      - 'fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - '.gitignore'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/**'
      - 'packages/**'
      - 'fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - '.gitignore'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Product verify
        if: github.ref == 'refs/heads/main'
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build

      - name: Build the game into the site at /play/
        run: pnpm build:play

      - name: Play-through
        if: github.ref == 'refs/heads/main'
        run: pnpm test:play ghost --fixture naive-ndjson

      - name: Install site dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Audit site lockfile
        working-directory: site
        run: npm audit --audit-level=high

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Require /play/ in the dist
        run: |
          if [ ! -s site/dist/play/index.html ]; then
            echo "site/dist/play/index.html is missing or empty"
            exit 1
          fi
          {
            echo "## Pages build"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- play: site/dist/play/index.html present ($(wc -c < site/dist/play/index.html) bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Record deploy
        run: |
          {
            echo "## Pages deploy"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- url: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
