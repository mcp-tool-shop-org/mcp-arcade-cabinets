name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/**'
      - 'packages/**'
      - 'fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - '.gitignore'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/**'
      - 'packages/**'
      - 'fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - '.gitignore'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build handbook and play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install the workspace
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        id: lint
        if: github.ref == 'refs/heads/main'
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        if: github.ref == 'refs/heads/main'
        run: pnpm typecheck

      - name: Test
        id: test
        if: github.ref == 'refs/heads/main'
        run: pnpm test

      - name: Build
        id: product_build
        if: github.ref == 'refs/heads/main'
        run: pnpm build

      - name: Build the game into the site at /play/
        id: play_build
        run: pnpm build:play

      - name: Play-through
        id: play_through
        if: github.ref == 'refs/heads/main'
        run: pnpm test:play ghost --fixture naive-ndjson

      - name: Install site dependencies
        id: site_ci
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Audit site lockfile
        id: site_audit
        working-directory: site
        run: npm audit --audit-level=high

      - name: Build site
        id: site_build
        working-directory: site
        run: npm run build

      - name: Require /play/ in the dist
        id: play_index
        run: |
          index=site/dist/play/index.html
          if [ ! -s "$index" ]; then
            echo "site/dist/play/index.html is missing or empty"
            echo "next: pnpm build:play then cd site && npm run build"
            exit 1
          fi
          if grep -q '/src/main.ts' "$index"; then
            echo "site/dist/play/index.html still scripts /src/main.ts (Vite source stub, not the hashed bundle)"
            echo "next: pnpm build:play then cd site && npm run build"
            exit 1
          fi
          if ! grep -q '/mcp-arcade-cabinets/play/' "$index"; then
            echo "site/dist/play/index.html is missing PLAY_BASE /mcp-arcade-cabinets/play/"
            echo "next: pnpm build:play then cd site && npm run build"
            exit 1
          fi
          js_count=$(find site/dist/play/assets -type f -name '*.js' 2>/dev/null | wc -l | tr -d ' ')
          if [ "${js_count:-0}" -lt 1 ]; then
            echo "site/dist/play/assets/ has no hashed JS"
            echo "next: pnpm build:play then cd site && npm run build"
            exit 1
          fi
          sprite_count=$(find site/dist/play/sprites -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "${sprite_count:-0}" -lt 1 ]; then
            echo "site/dist/play/sprites/ is missing or empty"
            echo "next: pnpm build:play then cd site && npm run build"
            exit 1
          fi
          # TRACK_KEYS beds (inspect poison rug unlisted breather whisperer menu doorman).
          # test:play is not proof of the uploaded Pages tree.
          track_keys="inspect poison rug unlisted breather whisperer menu doorman"
          missing_tracks=0
          track_count=0
          sample_track=
          for key in $track_keys; do
            f="site/dist/play/tracks/$key.mp3"
            if [ ! -s "$f" ]; then
              echo "site/dist/play/tracks/$key.mp3 is missing or empty"
              missing_tracks=1
            else
              track_count=$((track_count + 1))
              if [ -z "$sample_track" ]; then
                sample_track=$f
              fi
            fi
          done
          echo "tracks=${track_count}" >> "$GITHUB_OUTPUT"
          if [ -n "$sample_track" ]; then
            echo "play track: $sample_track ($(wc -c < "$sample_track" | tr -d ' ') bytes); tracks=$track_count"
          else
            echo "play tracks: 0"
          fi
          if [ "$missing_tracks" -ne 0 ]; then
            echo "next: pnpm build:play then cd site && npm run build"
            exit 1
          fi
          failed_src=0
          while IFS= read -r raw; do
            [ -z "$raw" ] && continue
            src=${raw#src=}
            src=${src#\"}
            src=${src#\'}
            src=${src%\"}
            src=${src%\'}
            case "$src" in
              /mcp-arcade-cabinets/play/*) target="site/dist/play/${src#/mcp-arcade-cabinets/play/}" ;;
              ./*) target="site/dist/play/${src#./}" ;;
              /*) target="site/dist/play$src" ;;
              *) target="site/dist/play/$src" ;;
            esac
            if [ ! -s "$target" ]; then
              echo "script src missing or empty: $src -> $target"
              failed_src=1
            else
              echo "asset: $target ($(wc -c < "$target" | tr -d ' ') bytes)"
            fi
          done < <(grep -oE "src=[\"'][^\"']+[\"']" "$index" || true)
          if [ "$failed_src" -ne 0 ]; then
            echo "next: pnpm build:play then cd site && npm run build"
            exit 1
          fi
          echo "play index: $(wc -c < "$index" | tr -d ' ') bytes; assets js=$js_count; sprites=$sprite_count; tracks=$track_count"

      - id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Site / Build handbook and play"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- ref: \`${{ github.ref }}\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- play_build: ${{ steps.play_build.outcome }}"
            echo "- site_ci: ${{ steps.site_ci.outcome }}"
            echo "- site_audit: ${{ steps.site_audit.outcome }}"
            echo "- site_build: ${{ steps.site_build.outcome }}"
            echo "- play_index: ${{ steps.play_index.outcome }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "- lint: ${{ steps.lint.outcome }}"
              echo "- typecheck: ${{ steps.typecheck.outcome }}"
              echo "- test: ${{ steps.test.outcome }}"
              echo "- product_build: ${{ steps.product_build.outcome }}"
              echo "- play_through: ${{ steps.play_through.outcome }}"
              echo "- upload-pages-artifact: ${{ steps.upload.outcome }}"
              if [ "${{ job.status }}" = "success" ]; then
                echo "- deploy: queued"
              else
                echo "- deploy: will not run"
              fi
            else
              echo "- deploy skipped (not main; production was not deployed)"
            fi
            if [ -s site/dist/play/index.html ]; then
              echo "- play index: present ($(wc -c < site/dist/play/index.html | tr -d ' ') bytes)"
              js=$(ls site/dist/play/assets/*.js 2>/dev/null | head -n 1 || true)
              if [ -n "$js" ] && [ -s "$js" ]; then
                echo "- play asset: \`$js\` ($(wc -c < "$js" | tr -d ' ') bytes)"
              else
                echo "- play asset: missing"
              fi
              sc=$(find site/dist/play/sprites -type f 2>/dev/null | wc -l | tr -d ' ')
              tc="${{ steps.play_index.outputs.tracks }}"
              if [ -z "$tc" ]; then
                tc=0
                for key in inspect poison rug unlisted breather whisperer menu doorman; do
                  if [ -s "site/dist/play/tracks/$key.mp3" ]; then
                    tc=$((tc + 1))
                  fi
                done
              fi
              echo "- play sprites: ${sc:-0} files; play tracks: ${tc:-0} files"
              trk=$(ls site/dist/play/tracks/*.mp3 2>/dev/null | head -n 1 || true)
              if [ -n "$trk" ] && [ -s "$trk" ]; then
                echo "- play track: \`$trk\` ($(wc -c < "$trk" | tr -d ' ') bytes)"
              else
                echo "- play track: missing"
              fi
            elif [ -e site/dist/play/index.html ]; then
              echo "- play index: empty"
            else
              echo "- play index: missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Next local command
        if: failure()
        run: |
          {
            echo "## Site / Build handbook and play failed"
            echo "Re-run the failing gate locally:"
            [ "${{ steps.install.outcome }}" = "failure" ] && echo "- next: pnpm install --frozen-lockfile --ignore-scripts"
            [ "${{ steps.lint.outcome }}" = "failure" ] && echo "- next: pnpm lint"
            [ "${{ steps.typecheck.outcome }}" = "failure" ] && echo "- next: pnpm typecheck"
            [ "${{ steps.test.outcome }}" = "failure" ] && echo "- next: pnpm test"
            [ "${{ steps.product_build.outcome }}" = "failure" ] && echo "- next: pnpm build"
            [ "${{ steps.play_build.outcome }}" = "failure" ] && echo "- next: pnpm build:play"
            [ "${{ steps.play_through.outcome }}" = "failure" ] && echo "- next: pnpm test:play ghost --fixture naive-ndjson"
            [ "${{ steps.site_ci.outcome }}" = "failure" ] && echo "- next: cd site && npm ci --ignore-scripts"
            [ "${{ steps.site_audit.outcome }}" = "failure" ] && echo "- next: cd site && npm audit --audit-level=high"
            [ "${{ steps.site_build.outcome }}" = "failure" ] && echo "- next: cd site && npm run build"
            [ "${{ steps.play_index.outcome }}" = "failure" ] && echo "- next: pnpm build:play then cd site && npm run build"
            [ "${{ steps.upload.outcome }}" = "failure" ] && echo "- next: inspect upload-pages-artifact (path: site/dist)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Record deploy
        if: always()
        run: |
          {
            echo "## Pages deploy"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- ref: \`${{ github.ref }}\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- url: \`${{ steps.deployment.outputs.page_url }}\`"
            if [ -z "${{ steps.deployment.outputs.page_url }}" ]; then
              echo "- deploy did not run"
              echo "- next: inspect the github-pages environment / deploy-pages step"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
