# Publish the cabinets to npm — one package per cabinet.
#
# `@mcptoolshop/ghost-on-the-menu` from packages/launcher and
# `@mcptoolshop/vibe-typer` from packages/launcher-vibe-typer. One job, one
# gate, one loop: a release publishes both or neither, and a rerun publishes
# only what is not on the registry yet.
#
# Fires on a published release only, so it costs nothing until a release is
# cut, and does not count against the two push-triggered workflows the house
# rule allows. workflow_dispatch is here to exercise it without a release;
# it dry-runs by default and will only publish when asked in as many words.
#
# Authentication is npm Trusted Publishing (OIDC). There is no NPM_TOKEN in
# this repo and there must not be one: the trust is pinned on npmjs.com to
# this repository AND this filename.
#
# THE FILENAME IS LOAD-BEARING TWICE OVER, AND NOW FOR TWO PACKAGES. It is
# `release.yml` because that is the org convention for the TP-configured
# workflow, and because npm pins the trust to it — separately for each
# package. Renaming this file breaks publishing for both until both trusts
# are re-pointed on npmjs.com.
#
# A package must already EXIST on npm before a trusted publisher can be
# configured for it — npm has no equivalent of PyPI's pending publishers,
# for the access page and for `npm trust` alike. The first version of each
# is therefore published by hand; see docs/npm-launcher.md.
#
# Standards compliance, including the compensators table that `npm publish`
# requires: docs/npm-launcher.md.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and check without publishing'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NO `environment:` here, deliberately. GitHub's OIDC subject claim gains
    # an `:environment:<name>` segment when a job declares one, and npm's
    # trusted publisher for this package is configured WITHOUT an environment.
    # The two must agree or the publish fails as a masked E404. If you ever add
    # an environment for deployment protection, add it on npmjs.com in the same
    # sitting -- never on one side alone.
    permissions:
      contents: read
      # Trusted Publishing and the provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: npm with Trusted Publishing
        id: npm_version
        run: |
          npm install -g npm@latest
          npm --version
          # OIDC Trusted Publishing landed in npm 11.5.1.
          node -e '
          const [maj, min, pat] = process.argv[1].split(".").map(Number);
          const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
          if (!ok) {
            console.log("npm " + process.argv[1] + " is too old for Trusted Publishing");
            console.log("next: npm install -g npm@latest");
            process.exit(1);
          }
          console.log("npm " + process.argv[1] + " supports Trusted Publishing");
          ' "$(npm --version)"

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: One version across the repo, and it matches the tag
        id: version
        run: |
          set -e
          root=$(node -p "require('./package.json').version")
          echo "package=$root" >> "$GITHUB_OUTPUT"
          echo "root: $root"
          # Every package.json in the workspace, not just the two published
          # ones: the shell and the sim are bundled INTO the packages, so a
          # package left behind ships inside a tarball that claims the new
          # version. The published pair is checked by the same loop.
          bad=0
          for manifest in package.json apps/*/package.json packages/*/package.json; do
            # A glob that matched nothing is passed through as its own text.
            [ -e "$manifest" ] || continue
            v=$(node -p "require('./$manifest').version || ''")
            [ -z "$v" ] && continue
            echo "- $manifest: $v"
            if [ "$v" != "$root" ]; then
              echo "$manifest is $v but the repo is $root"
              bad=1
            fi
          done
          if [ "$bad" != "0" ]; then
            echo "next: put every package.json on one version"
            exit 1
          fi
          pkg="$root"
          # SERVER_VERSION is what the MCP seat reports to a client in its
          # handshake. It is a hand-written constant, so it drifts silently:
          # v0.8.0 shipped announcing 0.7.0 because this check did not exist.
          srv=$(node -p "(require('fs').readFileSync('packages/cabinet-server/src/server.ts','utf8').match(/SERVER_VERSION[^0-9]+([0-9][0-9.]*)/) || ['',''])[1]")
          echo "SERVER_VERSION: $srv"
          if [ "$srv" != "$pkg" ]; then
            echo "SERVER_VERSION is $srv but the packages are $pkg"
            echo "next: set SERVER_VERSION in packages/cabinet-server/src/server.ts to $pkg"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "v$pkg" ]; then
              echo "release tag $tag does not name version $pkg"
              echo "next: tag the release v$pkg, or bump the packages to match $tag"
              exit 1
            fi
            echo "tag $tag matches"
          fi

      - name: Verify
        id: verify
        run: pnpm verify

      - name: Build both packages
        id: build
        run: pnpm build:launcher

      - name: Both built bins run
        id: smoke
        run: |
          set -e
          want="${{ steps.version.outputs.package }}"
          for dir in packages/launcher packages/launcher-vibe-typer; do
            got=$(node "$dir/dist/cli.js" --version)
            if [ "$got" != "$want" ]; then
              echo "$dir/dist/cli.js --version said $got, package.json says $want"
              echo "next: pnpm build:launcher"
              exit 1
            fi
            echo "- $dir --version: $got"
          done
          # The typing cabinet has no MCP server yet. `--mcp` must say so and
          # leave with 2 — not 0 (which would read as "it worked"), not 1
          # (which would read as "it broke"), and never a browser.
          set +e
          out=$(node packages/launcher-vibe-typer/dist/cli.js --mcp 2>&1)
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "vibe-typer --mcp left with $code, want 2"
            echo "next: node packages/launcher-vibe-typer/dist/cli.js --mcp"
            exit 1
          fi
          case "$out" in
            *"slice 4"*) echo "- vibe-typer --mcp: exit 2, $out" ;;
            *)
              echo "vibe-typer --mcp said '$out', which does not name the slice"
              exit 1
              ;;
          esac

      - name: The Ghost seat still lists its tools
        id: mcp
        working-directory: packages/launcher
        run: |
          set -e
          # The MCP seat must list its six tools over stdio with no network.
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          notified='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          printf '%s\n' "$init" "$notified" "$list" | timeout 30 node dist/cli.js --mcp > /tmp/mcp.out 2>/tmp/mcp.err || true
          cat /tmp/mcp.err >&2 || true
          if ! python3 -c '
          import json, sys
          need = {"fire", "say", "speak", "sfx", "view", "tapes"}
          found = set()
          for line in sys.stdin.read().splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  msg = json.loads(line)
              except json.JSONDecodeError:
                  continue
              tools = (msg.get("result") or {}).get("tools")
              if isinstance(tools, list):
                  for t in tools:
                      if isinstance(t, dict) and isinstance(t.get("name"), str):
                          found.add(t["name"])
          if found != need:
              print("tools/list was", ",".join(sorted(found)) or "(nothing)", "want", ",".join(sorted(need)))
              sys.exit(1)
          print("tools/list:", ",".join(sorted(found)))
          ' < /tmp/mcp.out; then
            echo "next: node packages/launcher/dist/cli.js --mcp"
            exit 1
          fi

      - name: Both tarballs carry their cabinet and no sources
        id: tarball
        run: |
          set -e
          for dir in packages/launcher packages/launcher-vibe-typer; do
            ( cd "$dir" && npm pack --dry-run --json ) > /tmp/pack.json
            PACK_DIR="$dir" node -e '
            const dir = process.env.PACK_DIR;
            const pack = require("/tmp/pack.json")[0];
            const files = pack.files.map((f) => f.path);
            // Each package carries its own cabinet and only its own. The
            // "gone" list is what the split added: 0.9.0 shipped both
            // cabinets inside the package named for one, and the way that
            // comes back is silently, through a shell built without
            // VITE_CABINET.
            const spec = dir === "packages/launcher"
              ? {
                  need: ["dist/cli.js", "dist/cabinet-stdio.js", "dist/cabinet-server.js"],
                  carries: ["dist/play/sprites/", "dist/play/tracks/"],
                  gone: ["dist/play/keys/", "dist/play/vibe/"],
                }
              : {
                  need: ["dist/cli.js", "dist/cabinet-server.js"],
                  carries: ["dist/play/keys/", "dist/play/vibe/"],
                  gone: ["dist/play/sprites/", "dist/play/tracks/", "dist/cabinet-stdio.js"],
                };
            const need = [...spec.need, "dist/play/index.html", "README.md", "LICENSE"];
            const missing = need.filter((n) => !files.includes(n));
            if (missing.length) {
              console.log(dir + " tarball is missing: " + missing.join(", "));
              console.log("next: pnpm build:launcher");
              process.exit(1);
            }
            const thin = spec.carries.filter((p) => !files.some((f) => f.startsWith(p)));
            if (thin.length) {
              console.log(dir + " tarball carries no " + thin.join(", "));
              console.log("next: pnpm build:launcher");
              process.exit(1);
            }
            const other = files.filter((f) => spec.gone.some((p) => f === p || f.startsWith(p)));
            if (other.length) {
              console.log(dir + " tarball carries the other cabinet: " + other.slice(0, 5).join(", "));
              console.log("next: check the public split in packages/launcher/scripts/build.mjs");
              process.exit(1);
            }
            const leaked = files.filter((f) => /\.tsx?$|\.map$|^src\/|^test\/|tsconfig/.test(f));
            if (leaked.length) {
              console.log(dir + " tarball carries sources: " + leaked.join(", "));
              console.log("next: check the files field in " + dir + "/package.json");
              process.exit(1);
            }
            const tapes = files.filter((f) => f.startsWith("dist/tapes/")).length;
            if (tapes < 20) {
              console.log(dir + " tarball has " + tapes + " tapes, want 20");
              console.log("next: pnpm build:launcher");
              process.exit(1);
            }
            console.log(
              "- " + dir + ": " + pack.entryCount + " files" +
              ", " + tapes + " tapes" +
              ", packed " + (pack.size / 1048576).toFixed(1) + " MB" +
              ", unpacked " + (pack.unpackedSize / 1048576).toFixed(1) + " MB",
            );
            ' | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # One loop over both package directories, and it is idempotent on
      # purpose. A publish that half-succeeded — the first package on the
      # registry, the second refused — used to be a dead end, because npm
      # will not take a version string twice and there is no undoing the
      # first after 72 hours. `npm view <name>@<version> version` succeeding
      # means that exact version is already there, so a rerun skips it and
      # publishes only the straggler.
      - name: Publish both
        id: publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: |
          set -e
          for dir in packages/launcher packages/launcher-vibe-typer; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "- $name@$version is already on the registry; skipping"
              continue
            fi
            echo "- publishing $name@$version"
            ( cd "$dir" && npm publish --provenance --access public )
          done

      - name: Dry run both
        id: dry
        if: github.event_name != 'release' && inputs.dry_run != false
        run: |
          set -e
          for dir in packages/launcher packages/launcher-vibe-typer; do
            ( cd "$dir" && npm publish --provenance --access public --dry-run )
          done

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Publish / npm"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- version: \`${{ steps.version.outputs.package }}\`"
            echo "- event: ${{ github.event_name }}"
            published="no (dry run)"
            [ "${{ steps.publish.outcome }}" = "success" ] && published="yes"
            echo "- published: $published"
            echo "- npm: ${{ steps.npm_version.outcome }}"
            echo "- version gate: ${{ steps.version.outcome }}"
            echo "- verify: ${{ steps.verify.outcome }}"
            echo "- build: ${{ steps.build.outcome }}"
            echo "- bin smoke (both --version, vibe --mcp exit 2): ${{ steps.smoke.outcome }}"
            echo "- Ghost --mcp tools/list: ${{ steps.mcp.outcome }}"
            echo "- tarball contract (both): ${{ steps.tarball.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Next local command
        if: failure()
        run: |
          {
            echo "## Publish / npm failed"
            echo "Nothing was published unless the publish step itself is the one that failed."
            echo "That step is idempotent: re-running it publishes only the package that is not on the registry yet."
            echo "Re-run the failing gate locally:"
            [ "${{ steps.version.outcome }}" = "failure" ] && echo "- next: put every package.json on the tag's version"
            [ "${{ steps.install.outcome }}" = "failure" ] && echo "- next: pnpm install --frozen-lockfile"
            [ "${{ steps.verify.outcome }}" = "failure" ] && echo "- next: pnpm verify"
            [ "${{ steps.build.outcome }}" = "failure" ] && echo "- next: pnpm build:launcher"
            [ "${{ steps.smoke.outcome }}" = "failure" ] && echo "- next: node packages/launcher-vibe-typer/dist/cli.js --mcp"
            [ "${{ steps.mcp.outcome }}" = "failure" ] && echo "- next: node packages/launcher/dist/cli.js --mcp"
            [ "${{ steps.tarball.outcome }}" = "failure" ] && echo "- next: cd packages/launcher && npm pack --dry-run, and the same in packages/launcher-vibe-typer"
            [ "${{ steps.publish.outcome }}" = "failure" ] && echo "- next: see docs/npm-launcher.md for what a half-finished publish leaves behind"
          } >> "$GITHUB_STEP_SUMMARY"
