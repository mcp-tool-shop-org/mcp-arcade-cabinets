# Host-only compose for the local cabinet image.
# Gateway and the voice worker stay on the host — do not add them as services.
# Not copied into catalog/. Catalog stays stdio, network off, silent, no secrets.
#
#   docker compose -f voice/compose.host.yaml run --rm cabinet
#
# Host gateway (not this file): docker mcp gateway run
# Host voice (not this file):   pnpm voice
#   # VOICE_URL=http://host.docker.internal:7788
#   # VOICE_TOKEN=<token>

services:
  cabinet:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mcp-arcade-cabinets:host
    stdin_open: true
    cpus: '1.0'
    mem_limit: 2g
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Optional operator tapes (read-only). Leave unset for the baked twenty.
    # volumes:
    #   - ${TAPES_USER}:/tapes-user:ro
    #
    # One `environment:` key, because a mapping may only have one: the file
    # used to offer two commented blocks under this service and an operator
    # who followed both invitations wrote a duplicate key, which Compose
    # either rejects or resolves by dropping the tapes mount. Uncomment the
    # header and whichever lines below it you want.
    #
    # `CABINET: vibe` runs the typing cabinet; unset or `ghost` is the
    # shooter. VOICE_URL and VOICE_TOKEN are the host worker and are read by
    # the shooter only — never on a Catalog run.
    # environment:
    #   CABINET: vibe
    #   CABINET_TAPES_USER: /tapes-user
    #   VOICE_URL: http://host.docker.internal:7788
    #   VOICE_TOKEN: ${VOICE_TOKEN}
